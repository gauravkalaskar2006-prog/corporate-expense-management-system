<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile · Corporate Expense</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="app-shell">
  {% include "_sidebar.html" %}
  <main class="main-area">
    <header class="topbar"><div><p class="eyebrow">ACCOUNT</p><h1>My profile</h1><p class="muted">Your employee account details.</p></div></header>
    <section class="panel profile-panel"><dl class="detail-grid">
      {% for label, value in fields %}<div><dt>{{ label }}</dt><dd>{{ value or "Not provided" }}</dd></div>{% endfor %}
    </dl></section>
    <footer class="page-footer">Contact your administrator to update account details.</footer>
  </main>
</div><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
